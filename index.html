
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Explora la oferta de convenios de Study Abroad de la Universidad de los Andes."
  />

  <title>Convenios Study Abroad | Universidad de los Andes</title>

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">

    <!-- Introducción -->
    <header class="intro">

      <h1>Oportunidades para Free movers</h1>

      <p>
        Explora la oferta de convenios de study abroad de Uniandes.
        Recuerda verificar el detalle de los requisitos para
        participar en cada uno de ellos.
      </p>

    </header>

    <!-- Filtros y resultados -->
    <div class="layout">

      <aside
        class="filters"
        aria-label="Filtros de convenios Study Abroad"
      >

        <h2>Filtrar por</h2>

        <div id="filters-container"></div>

        <button
          class="clear-button"
          id="clear-filters"
          type="button"
          disabled
        >
          ⌫ &nbsp; Limpiar
        </button>

      </aside>

      <section
        class="results"
        aria-label="Resultados de convenios Study Abroad"
      >

        <p
          class="results-count"
          id="results-count"
          aria-live="polite"
        ></p>

        <div
          class="cards-grid"
          id="cards-grid"
        ></div>

        <p
          class="empty-state"
          id="empty-state"
          hidden
        >
          No se encontraron convenios para los filtros seleccionados.
        </p>

      </section>

    </div>

  </main>
</body>
</html>
